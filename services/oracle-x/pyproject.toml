[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skooby-oracle-x"
version = "0.1.0"
description = "Evidence-driven cryptocurrency research and paper trading service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["oracle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
