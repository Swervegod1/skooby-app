plugins {
    id 'com.android.application'
}
android {
    namespace 'app.skooby.oracle'
    compileSdk 35
    defaultConfig {
        applicationId 'app.skooby.oracle'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
